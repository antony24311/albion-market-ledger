name: Windows desktop app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/windows-desktop-app
    paths:
      - "albion_tracker/**"
      - "cmd/**"
      - "internal/**"
      - "web/**"
      - "scripts/build-windows-app.ps1"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/windows-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build single-file Windows app
        shell: powershell
        run: ./scripts/build-windows-app.ps1

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: AlbionMarketLedger-Windows
          path: dist/AlbionMarketLedger.exe
          if-no-files-found: error
          retention-days: 30
